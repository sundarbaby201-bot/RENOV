<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verification - RENVO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body class="auth-page">
    <header class="auth-topbar">
      <div class="container">
        <a href="/index.html" class="logo" aria-label="RENVO home">
          <span class="logo-mark" aria-hidden="true">R</span>
          <span class="logo-text">RENVO</span>
        </a>
        <a href="/index.html" class="auth-back">&larr; Back to home</a>
      </div>
    </header>

    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-card-head">
          <div class="otp-illustration" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.6" />
              <path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </div>
          <h1>Verify your email</h1>
          <p>Enter the 6-digit code sent to <strong id="emailDisplay">your email</strong>.</p>
        </div>

        <div id="demoBanner"></div>

        <!-- OTP inputs -->
        <div class="otp-inputs" id="otpInputs">
          <input type="text" inputmode="numeric" maxlength="1" class="otp-input" aria-label="Digit 1" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-input" aria-label="Digit 2" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-input" aria-label="Digit 3" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-input" aria-label="Digit 4" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-input" aria-label="Digit 5" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-input" aria-label="Digit 6" />
        </div>
        <span class="field-error" id="err-otp" style="text-align:center; display:block;"></span>

        <!-- Countdown + resend -->
        <p class="otp-meta" id="otpMeta">Resend available in <span id="countdown">30</span>s</p>
        <div class="resend-row">
          Didn't get a code?
          <button type="button" id="resendBtn" disabled>Resend OTP</button>
        </div>

        <div style="margin-top: var(--space-2);">
          <button type="button" class="btn btn-primary btn-block" id="verifyBtn">Verify OTP</button>
        </div>

        <p class="auth-foot">
          <a href="/login.html">Back to login</a>
        </p>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/auth.js"></script>
    <script type="module">
      /* OTP page logic (Vanilla JS) — real Supabase Auth OTP */
      const { showToast, redirectIfLoggedIn, supabase, isCloudConfigured } = window.RENVO;

      document.getElementById("demoBanner").innerHTML = window.RENVO.demoBannerHTML();

      // If already logged in and verified, skip to role selection.
      redirectIfLoggedIn();

      // Get the email that was stored during signup.
      const pendingEmail = sessionStorage.getItem("renvo_pending_email") || "";
      if (pendingEmail) {
        document.getElementById("emailDisplay").textContent = pendingEmail;
      }

      const inputs = Array.from(document.querySelectorAll(".otp-input"));
      const verifyBtn = document.getElementById("verifyBtn");
      const resendBtn = document.getElementById("resendBtn");
      const countdownEl = document.getElementById("countdown");
      let countdown = 30;
      let countdownTimer = null;
      let isVerifying = false;

      // Auto-advance focus between OTP boxes.
      inputs.forEach((input, index) => {
        input.addEventListener("input", () => {
          input.value = input.value.replace(/\D/g, "");
          if (input.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });
      });

      // Resend countdown timer.
      function startCountdown() {
        countdown = 30;
        resendBtn.disabled = true;
        countdownEl.textContent = countdown;
        clearInterval(countdownTimer);
        countdownTimer = setInterval(() => {
          countdown--;
          if (countdownEl) countdownEl.textContent = countdown;
          if (countdown <= 0) {
            clearInterval(countdownTimer);
            resendBtn.disabled = false;
            document.getElementById("otpMeta").textContent = "You can resend the code now.";
          }
        }, 1000);
      }
      startCountdown();

      function getEnteredOtp() {
        return inputs.map((i) => i.value).join("");
      }

      function clearInvalid() {
        inputs.forEach((i) => i.classList.remove("invalid"));
        document.getElementById("err-otp").textContent = "";
      }

      // Verify the OTP code using Supabase Auth.
      verifyBtn.addEventListener("click", async () => {
        if (isVerifying) return;
        const entered = getEnteredOtp();

        if (entered.length !== 6) {
          inputs.forEach((i) => i.classList.add("invalid"));
          document.getElementById("err-otp").textContent = "Please enter all 6 digits.";
          return;
        }

        if (!pendingEmail) {
          showToast("Email not found. Please sign up again.");
          setTimeout(() => (window.location.href = "/signup.html"), 1500);
          return;
        }

        isVerifying = true;
        verifyBtn.disabled = true;
        verifyBtn.textContent = "Verifying…";
        clearInvalid();

        try {
          const { data, error } = await supabase.auth.verifyOtp({
            email: pendingEmail,
            token: entered,
            type: "email",
          });

          if (error) {
            inputs.forEach((i) => i.classList.add("invalid"));
            document.getElementById("err-otp").textContent = error.message || "Invalid or expired code.";
            showToast("Verification failed. Please check your code.");
            isVerifying = false;
            verifyBtn.disabled = false;
            verifyBtn.textContent = "Verify OTP";
            return;
          }

          // OTP verified — session is now active.
          showToast("Email verified! Welcome to RENVO.");
          sessionStorage.removeItem("renvo_pending_email");
          setTimeout(() => {
            window.location.href = "/role-selection.html";
          }, 1000);
        } catch (err) {
          showToast("Verification failed. Please try again.");
          isVerifying = false;
          verifyBtn.disabled = false;
          verifyBtn.textContent = "Verify OTP";
        }
      });

      // Resend a new OTP code.
      resendBtn.addEventListener("click", async () => {
        if (!pendingEmail) {
          showToast("Email not found. Please sign up again.");
          return;
        }
        resendBtn.disabled = true;
        try {
          const { error } = await supabase.auth.resend({
            type: "signup",
            email: pendingEmail,
          });
          if (error) {
            showToast(error.message || "Could not resend code.");
            resendBtn.disabled = false;
            return;
          }
          showToast("A new verification code has been sent to your email.");
          inputs.forEach((i) => (i.value = ""));
          inputs[0].focus();
          clearInvalid();
          document.getElementById("otpMeta").innerHTML = 'Resend available in <span id="countdown">30</span>s';
          startCountdown();
        } catch {
          showToast("Could not resend code. Please try again.");
          resendBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
