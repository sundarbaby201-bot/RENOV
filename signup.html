<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - RENVO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body class="auth-page">
    <header class="auth-topbar">
      <div class="container">
        <a href="/index.html" class="logo" aria-label="RENVO home">
          <span class="logo-mark" aria-hidden="true">R</span>
          <span class="logo-text">RENVO</span>
        </a>
        <a href="/index.html" class="auth-back">&larr; Back to home</a>
      </div>
    </header>

    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-card-head">
          <h1>Create your RENVO account</h1>
          <p>Join the marketplace for pre-owned electronics.</p>
        </div>

        <div id="demoBanner"></div>

        <form id="signupForm" novalidate>
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" class="form-control" placeholder="e.g. Alex Morgan" autocomplete="name" />
            <span class="field-error" id="err-fullName"></span>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" autocomplete="email" />
            <span class="field-error" id="err-email"></span>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" class="form-control" placeholder="+1 555 123 4567" autocomplete="tel" />
            <span class="field-error" id="err-phone"></span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-field">
              <input type="password" id="password" name="password" class="form-control" placeholder="Create a password (min 6 characters)" autocomplete="new-password" />
              <button type="button" class="toggle-password" aria-label="Show password">Show</button>
            </div>
            <span class="field-error" id="err-password"></span>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-field">
              <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Re-enter your password" autocomplete="new-password" />
              <button type="button" class="toggle-password" aria-label="Show password">Show</button>
            </div>
            <span class="field-error" id="err-confirmPassword"></span>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="terms" name="terms" />
            <label for="terms">
              I agree to the
              <a href="/index.html#terms">Terms &amp; Conditions</a>
              and
              <a href="/index.html#privacy">Privacy Policy</a>.
            </label>
          </div>
          <span class="field-error" id="err-terms"></span>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create Account</button>
        </form>

        <p class="auth-foot">
          Already have an account?
          <a href="/login.html">Login</a>
        </p>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/auth.js"></script>
    <script type="module">
      /* Signup page logic (Vanilla JS) — real Supabase Auth */
      const { showToast, isEmail, isPhone, setupPasswordToggles, redirectIfLoggedIn, supabase, isCloudConfigured } = window.RENVO;

      redirectIfLoggedIn();
      document.getElementById("demoBanner").innerHTML = window.RENVO.demoBannerHTML();
      setupPasswordToggles();

      const form = document.getElementById("signupForm");
      const submitBtn = document.getElementById("submitBtn");

      // Store the email for the OTP page to use after redirect.
      function setPendingEmail(email) {
        sessionStorage.setItem("renvo_pending_email", email);
      }

      function setError(fieldId, message) {
        const errEl = document.getElementById("err-" + fieldId);
        const field = document.getElementById(fieldId);
        if (errEl) errEl.textContent = message || "";
        if (field) field.classList.toggle("invalid", Boolean(message));
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const fullName = document.getElementById("fullName").value.trim();
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const terms = document.getElementById("terms").checked;

        let valid = true;

        if (!fullName) { setError("fullName", "Please enter your full name."); valid = false; }
        else setError("fullName", "");

        if (!email) { setError("email", "Please enter your email address."); valid = false; }
        else if (!isEmail(email)) { setError("email", "Please enter a valid email address."); valid = false; }
        else setError("email", "");

        if (!phone) { setError("phone", "Please enter your phone number."); valid = false; }
        else if (!isPhone(phone)) { setError("phone", "Please enter a valid phone number (7-15 digits)."); valid = false; }
        else setError("phone", "");

        if (!password) { setError("password", "Please create a password."); valid = false; }
        else if (password.length < 6) { setError("password", "Password must be at least 6 characters."); valid = false; }
        else setError("password", "");

        if (!confirmPassword) { setError("confirmPassword", "Please confirm your password."); valid = false; }
        else if (confirmPassword !== password) { setError("confirmPassword", "Passwords do not match."); valid = false; }
        else setError("confirmPassword", "");

        if (!terms) { setError("terms", "You must accept the Terms and Conditions."); valid = false; }
        else setError("terms", "");

        if (!valid) {
          showToast("Please fix the highlighted fields.");
          return;
        }

        // Check cloud configuration.
        if (!isCloudConfigured) {
          showToast("Backend is not configured. Please check your Supabase setup.");
          return;
        }

        // Disable the button to prevent duplicate submissions.
        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account…";

        try {
          // Call Supabase Auth signUp with user metadata.
          // Supabase will send a 6-digit OTP code to the email address.
          const { data, error } = await supabase.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                full_name: fullName,
                phone: phone,
              },
            },
          });

          if (error) {
            // Check for duplicate registration.
            if (error.message.includes("already") || error.message.includes("registered") || error.message.includes("exists")) {
              setError("email", "An account with this email already exists.");
              showToast("This email is already registered. Try logging in.");
            } else {
              showToast(error.message);
            }
            submitBtn.disabled = false;
            submitBtn.textContent = "Create Account";
            return;
          }

          // Save the email for the OTP page.
          setPendingEmail(email);

          showToast("Account created! A verification code has been sent to your email.");
          setTimeout(() => {
            window.location.href = "/otp.html";
          }, 1200);
        } catch (err) {
          showToast("Something went wrong. Please try again.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Create Account";
        }
      });
    </script>
  </body>
</html>
